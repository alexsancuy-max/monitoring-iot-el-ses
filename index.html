<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - Air Quality Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-start { background: #27ae60; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .status-box { text-align: center; font-weight: bold; margin: 10px; padding: 10px; border-radius: 5px; }
        .normal { background: #d4edda; color: #155724; }
        .bahaya { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #34495e; color: white; }
        .chart-container { position: relative; height: 40vh; width: 100%; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitoring Kualitas Udara</h2>

    <div id="statusAlert" class="status-box normal">KONDISI: AMAN</div>

    <div class="controls">
        <label>Interval (Detik): </label>
        <input type="number" id="intervalInput" value="5" min="1">
        <button class="btn-start" onclick="startLogging()">START</button>
        <button class="btn-stop" onclick="stopLogging()">STOP</button>
    </div>

    <div class="chart-container">
        <canvas id="airChart"></canvas>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Temp (°C)</th>
                <th>Hum (%)</th>
                <th>MQ135 (ADC)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    let loggingActive = false;
    let logInterval;
    const gscriptUrl = "URL_SCRIPT_GOOGLE_SHEETS_ANDA"; // GANTI DENGAN URL GOOGLE SCRIPT ANDA

    // Inisialisasi Grafik
    const ctx = document.getElementById('airChart').getContext('2d');
    const airChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'Temp (°C)', data: [], borderColor: '#e74c3c', fill: false },
                { label: 'MQ135', data: [], borderColor: '#f1c40f', fill: false }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    async function fetchData() {
        if (!loggingActive) return;

        try {
            // Kita mengambil data terbaru dari Google Sheets (butuh fungsi doGet tambahan di GS)
            const response = await fetch(gscriptUrl + "?read=true");
            const data = await response.json();

            updateDashboard(data);
        } catch (error) {
            console.error("Gagal mengambil data:", error);
        }
    }

    function updateDashboard(data) {
        const time = new Date().toLocaleTimeString();
        
        // Update Kondisi Khusus (Misal MQ135 > 1000)
        const statusBox = document.getElementById('statusAlert');
        if (data.mq > 1000) {
            statusBox.innerText = "KONDISI: BAHAYA (POLUSI TINGGI)";
            statusBox.className = "status-box bahaya";
        } else {
            statusBox.innerText = "KONDISI: AMAN";
            statusBox.className = "status-box normal";
        }

        // Update Tabel (Maksimal 10 baris terakhir)
        const table = document.getElementById('dataTable').getElementsByTagName('tbody')[0];
        const newRow = table.insertRow(0);
        newRow.innerHTML = `<td>${time}</td><td>${data.temp}</td><td>${data.hum}</td><td>${data.mq}</td>`;
        if (table.rows.length > 10) table.deleteRow(10);

        // Update Grafik
        if (airChart.data.labels.length > 15) {
            airChart.data.labels.shift();
            airChart.data.datasets[0].data.shift();
            airChart.data.datasets[1].data.shift();
        }
        airChart.data.labels.push(time);
        airChart.data.datasets[0].data.push(data.temp);
        airChart.data.datasets[1].data.push(data.mq);
        airChart.update();
    }

    function startLogging() {
        if (loggingActive) return;
        loggingActive = true;
        const interval = document.getElementById('intervalInput').value * 1000;
        logInterval = setInterval(fetchData, interval);
        alert("Logging Dimulai");
    }

    function stopLogging() {
        loggingActive = false;
        clearInterval(logInterval);
        alert("Logging Dihentikan");
    }
</script>
</body>
</html>
